name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Atm.slnx

      - name: Build
        run: dotnet build Atm.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Atm.slnx -c Release --no-build --verbosity normal
